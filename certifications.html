<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Certifications</title>
    <link rel="stylesheet" href="f.css"> <!-- Ton fichier CSS principal -->
    
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        .container {
            width: 90%;
            margin: auto;
            padding: 20px;
        }

        h2 {
            color: #333;
            font-size: 28px;
            margin-bottom: 20px;
        }

        .certifications-wrapper {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            width: 100%;
        }

        .certification {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        iframe {
            width: 100%;
            height: 500px; /* Ajuste la hauteur selon le besoin */
            border: none;
            border-radius: 8px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
        }

        /* Style du bouton Retour */
        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .back-btn:hover {
            background-color: #0056b3;
        }

    </style>
</head>
<body>

    <div class="container">
        <h2>Mes Certifications</h2>

        <div class="certifications-wrapper">
            <!-- Certification Node.js -->
            <div class="certification">
                <h3>Certification Node.js</h3>
                <iframe src="NodeJs.pdf"></iframe>
            </div>

            <!-- Certification Socket.io -->
            <div class="certification">
                <h3>Certification Socket.io</h3>
                <iframe src="Socket.pdf"></iframe>
            </div>
        </div>

        <!-- Bouton Retour -->
        <a href="index.html" class="back-btn">Retour au portfolio</a>
    </div>

</body>
</html>
