<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculatrice Casio Moderne</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: url('backs.png') no-repeat center center fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .calculator {
      background-color: #34495e;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
      width: 400px;
    }
    .screen {
      background: url('backs.png') no-repeat center center fixed;
    
      color: white;
      font-size: 3em;
      padding: 30px;
      border-radius: 10px;
      text-align: right;
      margin-bottom: 20px;
      width: 100%;
      height: 80px;
      box-sizing: border-box;
    }
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }
    button {
      background-color: #ecf0f1;
      border: none;
      border-radius: 15px;
      padding: 25px;
      font-size: 2em;
      cursor: pointer;
      transition: background-color 0.2s;
      height: 80px;
    }
    button:hover {
      background: url('backs.png') no-repeat center center fixed;
    }
    button:active {
      background-color: #7f8c8d;
    }
    button:focus {
      outline: none;
    }
    .wide {
      grid-column: span 2;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="screen" id="screen">0</div>
    <div class="buttons">
      <button onclick="clearScreen()">C</button>
      <button onclick="deleteLast()">←</button>
      <button onclick="appendOperator('/')">/</button>
      <button onclick="appendNumber('7')">7</button>
      <button onclick="appendNumber('8')">8</button>
      <button onclick="appendNumber('9')">9</button>
      <button onclick="appendOperator('*')">*</button>
      <button onclick="appendNumber('4')">4</button>
      <button onclick="appendNumber('5')">5</button>
      <button onclick="appendNumber('6')">6</button>
      <button onclick="appendOperator('-')">-</button>
      <button onclick="appendNumber('1')">1</button>
      <button onclick="appendNumber('2')">2</button>
      <button onclick="appendNumber('3')">3</button>
      <button onclick="appendOperator('+')">+</button>
      <button onclick="appendNumber('0')" class="wide">0</button>
      <button onclick="appendDot()">.</button>
      <button onclick="calculateResult()">=</button>
    </div>
  </div>

  <script>
    function clearScreen() {
      document.getElementById('screen').textContent = '0';
    }

    function deleteLast() {
      let current = document.getElementById('screen').textContent;
      document.getElementById('screen').textContent = current.length === 1 ? '0' : current.slice(0, -1);
    }

    function appendNumber(number) {
      let screen = document.getElementById('screen');
      if (screen.textContent === '0') {
        screen.textContent = number;
      } else {
        screen.textContent += number;
      }
    }

    function appendOperator(operator) {
      let screen = document.getElementById('screen');
      let lastChar = screen.textContent.slice(-1);
      if ('+-*/'.includes(lastChar)) {
        screen.textContent = screen.textContent.slice(0, -1);
      }
      screen.textContent += operator;
    }

    function appendDot() {
      let screen = document.getElementById('screen');
      if (!screen.textContent.includes('.')) {
        screen.textContent += '.';
      }
    }

    function calculateResult() {
      let screen = document.getElementById('screen');
      try {
        screen.textContent = eval(screen.textContent).toString();
      } catch {
        screen.textContent = 'Erreur';
      }
    }
  </script>
</body>
</html>
